# Respaldo externo para que el backend en Render (plan gratuito) no se duerma.
# El propio backend ya se mantiene despierto (src/utils/keepAlive.js); esto lo
# DESPIERTA si alguna vez llegara a dormirse (p. ej. tras un reinicio de Render).
# Nota: GitHub puede retrasar unos minutos las ejecuciones programadas.
name: Keep backend awake

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: |
          for i in 1 2 3; do
            if curl -fsS --max-time 90 https://qlcsw-b.onrender.com/api/health; then
              exit 0
            fi
            sleep 20
          done
          echo "El backend no respondió tras 3 intentos"
          exit 1
